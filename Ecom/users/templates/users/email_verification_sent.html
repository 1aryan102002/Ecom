{% extends 'MyEcom/base.html' %}
{% block content %}
<div id="verification-sent-card" class="max-w-md mx-auto bg-[#1a1c1e] p-8 rounded-lg shadow-lg mt-10 text-center">
    <h2 id="verification-sent-title" class="text-2xl font-bold text-white mb-4">Check your email</h2>
    <p id="verification-sent-message" class="text-gray-300 mb-6">
        We've sent a verification link to your email address. Click the link in the email to activate your account.
    </p>
    <a href="{% url 'hero_home' %}" id="verification-sent-home-btn" class="bg-[#febd69] text-black px-4 py-2 rounded hover:bg-[#e5b85c] transition">Back to Home</a>
</div>
{% endblock %}
